<!DOCTYPE html>
<html>
<head>
  <title>Mentira Maestra - Show Mode</title>
  <link rel="stylesheet" href="style.css">

  <!-- QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<!-- INTRO CINEMÁTICA -->
<div id="intro" class="introScreen">
  <h1 class="introTitle">MENTIRA MAESTRA</h1>
</div>

<!-- SONIDOS -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mp3">
</audio>

<audio id="revealSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_9c3e6a03f1.mp3" type="audio/mp3">
</audio>

<audio id="correctSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_3ed3c8b3e3.mp3" type="audio/mp3">
</audio>

<audio id="winSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_efc0b2ffcb.mp3" type="audio/mp3">
</audio>

<div class="screen">

  <div class="card center">
    <h1 class="title">🎭 Mentira Maestra</h1>
    <button onclick="createRoom()" class="primary">Crear Sala</button>
    <h2 id="roomCode"></h2>
    <div id="qr"></div>
  </div>

  <div class="card">
    <h3>Jugadores</h3>
    <div id="players"></div>
    <button onclick="startGame()" class="primary big">Iniciar Juego</button>
  </div>

  <div class="card showArea">
    <h2 id="roundInfo"></h2>
    <h3 id="question"></h3>
    <div id="timer" class="timer"></div>
    <div id="revealArea"></div>
    <div id="scoreboard"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentRoom = "";

/* ============================= */
/* CREAR SALA */
/* ============================= */
function createRoom() {
  socket.emit("createRoom");
  document.getElementById("bgMusic").play();
}

/* ============================= */
/* ROOM CREADO */
/* ============================= */
socket.on("roomCreated", (code) => {
  currentRoom = code;
  document.getElementById("roomCode").innerText = "Sala: " + code;

  const joinURL = window.location.origin + "/player.html";
  QRCode.toCanvas(document.getElementById("qr"), joinURL, { width: 200 });
});

/* ============================= */
/* ACTUALIZAR JUGADORES */
/* ============================= */
socket.on("updatePlayers", (players) => {
  document.getElementById("players").innerHTML =
    Object.values(players).map((p,i) =>
      `<div class="player" style="background:hsl(${i*40},70%,50%)">
        ${p}
      </div>`).join("");
});

/* ============================= */
/* INICIAR JUEGO */
/* ============================= */
function startGame() {
  socket.emit("startGame", currentRoom);
}

/* ============================= */
/* NUEVA RONDA */
/* ============================= */
socket.on("newRound", data => {
  fadeScreen();
  document.getElementById("roundInfo").innerText =
    `Ronda ${data.round} / ${data.total}`;
  document.getElementById("question").innerText = data.question;
  document.getElementById("revealArea").innerHTML = "";
  startTimer(data.writeTime);
});

/* ============================= */
/* VOTACIÓN */
/* ============================= */
socket.on("startVoting", data => {
  startTimer(data.voteTime);
});

/* ============================= */
/* RESULTADOS */
/* ============================= */
socket.on("roundResults", data => {
  dramaticReveal(data);
});

/* ============================= */
/* FIN DEL JUEGO */
/* ============================= */
socket.on("gameOver", finalBoard => {
  document.getElementById("winSound").play();
  launchConfetti();
  document.getElementById("revealArea").innerHTML =
    `<div class="winner">🏆 ${finalBoard[0].name} GANA!</div>`;
  updateScoreboard(finalBoard);
});

/* ============================= */
/* REVEAL DRAMÁTICO */
/* ============================= */
function dramaticReveal(data) {

  document.getElementById("revealSound").play();

  const area = document.getElementById("revealArea");
  area.innerHTML = "";

  const liesArray = Object.values(data.lies);
  liesArray.push(data.correct);

  let index = 0;

  function showNext() {

    if (index >= liesArray.length) {
      updateScoreboard(data.scoreboard);
      return;
    }

    const text = liesArray[index];

    const card = document.createElement("div");
    card.className = "revealCard";

    card.innerHTML = `<div class="revealText">${text}</div>`;

    const voters = data.voteDetails
      .filter(v => v.vote === text)
      .map(v => `<span class="voteBubble">${v.voter}</span>`)
      .join("");

    const voteContainer = document.createElement("div");
    voteContainer.className = "votes";
    voteContainer.innerHTML = voters;

    card.appendChild(voteContainer);

    if (text === data.correct) {
      card.classList.add("correctCard");
      document.getElementById("correctSound").play();
    }

    area.appendChild(card);

    index++;
    setTimeout(showNext, 2000);
  }

  showNext();

  // Mostrar quién engañó a quién
  setTimeout(() => {
    let summary = "";
    for (let liar in data.tricked) {
      summary += `<div class="trickSummary">
        ${data.players[liar]} engañó a ${data.tricked[liar].length} persona(s)
      </div>`;
    }
    area.innerHTML += summary;
  }, liesArray.length * 2000);
}

/* ============================= */
/* TABLA */
/* ============================= */
function updateScoreboard(board) {
  let html = "<h3>Tabla</h3>";
  board.forEach((p, i) => {
    html += `<div class="score ${i===0?'first':''}">
      ${p.name} — ${p.score}
    </div>`;
  });
  document.getElementById("scoreboard").innerHTML = html;
}

/* ============================= */
/* TIMER */
/* ============================= */
function startTimer(seconds) {
  let time = seconds;
  const timer = document.getElementById("timer");
  timer.innerText = time;

  const interval = setInterval(() => {
    time--;
    timer.innerText = time;
    if (time <= 0) clearInterval(interval);
  }, 1000);
}

/* ============================= */
/* CONFETTI */
/* ============================= */
function launchConfetti() {
  confetti({
    particleCount: 200,
    spread: 120,
    origin: { y: 0.6 }
  });
}

/* ============================= */
/* TRANSICIÓN */
/* ============================= */
function fadeScreen() {
  document.body.classList.add("fade");
  setTimeout(() => document.body.classList.remove("fade"), 500);
}
</script>

</body>
</html>
