<!DOCTYPE html>
<html>
<head>
  <title>Mentira Maestra - TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center">

<div class="text-center max-w-5xl w-full px-6">

  <h1 class="text-5xl font-bold mb-6">
    🎭 Mentira Maestra
  </h1>

  <!-- LOBBY -->
  <div id="lobbyContainer">

    <div id="roomSection" class="mb-8 hidden">
      <h2 class="text-3xl mb-2">
        Código: <span id="roomCode"></span>
      </h2>
      <img id="qrImage" class="mx-auto mt-4 w-48">
    </div>

    <div id="playersSection" class="mb-8 hidden">
      <h2 class="text-2xl mb-4">Jugadores</h2>

      <div id="playersList"
           class="space-y-2 text-xl"></div>

      <button id="startBtn"
        onclick="startGame()"
        class="mt-6 bg-green-500 px-6 py-3 rounded text-xl font-bold">
        Iniciar partida
      </button>
    </div>

  </div>

  <!-- GAME AREA -->
  <div id="gameSection"></div>

  <!-- TIMER -->
  <div id="timerContainer"
       class="mt-6 hidden w-full">
    <div class="w-full bg-gray-700 h-6 rounded">
      <div id="timerBar"
           class="bg-red-500 h-6 rounded transition-all">
      </div>
    </div>
  </div>

</div>

<script>
const socket = io("/host");
let currentRoomCode = null;
let timerInterval = null;

/* ================= CREATE ROOM ================= */

socket.emit("createRoom");

socket.on("roomCreated", data => {

  currentRoomCode = data.code;

  document.getElementById("roomSection")
    .classList.remove("hidden");

  document.getElementById("playersSection")
    .classList.remove("hidden");

  document.getElementById("roomCode")
    .innerText = data.code;

  document.getElementById("qrImage")
    .src = data.qr;
});

/* ================= SHOW PLAYERS ================= */

socket.on("updatePlayers", players => {

  const list =
    document.getElementById("playersList");

  list.innerHTML = "";

  players.forEach(name => {
    const div =
      document.createElement("div");

    div.className =
      "bg-gray-800 px-4 py-2 rounded";

    div.innerText = name;

    list.appendChild(div);
  });
});

/* ================= START GAME ================= */

function startGame(){
  socket.emit("startGame", currentRoomCode);
}

/* ================= GAME EVENTS ================= */

socket.on("tvQuestion", question => {

  document.getElementById("lobbyContainer")
    .classList.add("hidden");

  document.getElementById("gameSection")
    .innerHTML =
      `<h2 class="text-5xl mt-10">${question}</h2>`;
});

/* ================= TIMER ================= */

socket.on("tvTimer", data => {

  const container =
    document.getElementById("timerContainer");

  const bar =
    document.getElementById("timerBar");

  container.classList.remove("hidden");

  const duration = data.duration;
  const start = Date.now();

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {

    const elapsed = Date.now() - start;
    const remaining =
      Math.max(duration - elapsed, 0);

    const percent =
      (remaining / duration) * 100;

    bar.style.width = percent + "%";

    if (remaining <= 0) {
      clearInterval(timerInterval);
      container.classList.add("hidden");
    }

  }, 100);
});

/* ================= RESULTS ================= */

socket.on("tvResults", data => {

  document.getElementById("gameSection")
    .innerHTML =
      `<h2 class="text-4xl mt-10">Respuesta:</h2>
       <p class="text-3xl mt-4">${data.answer}</p>`;
});

/* ================= FINAL ================= */

socket.on("tvFinal", data => {

  let html =
    `<h1 class="text-5xl mt-10 mb-6">🏆 RESULTADOS</h1>`;

  html += data.ranking.map((p,i)=>
    `<div class="text-2xl">
       ${i+1}. ${p.name} - ${p.score} pts
     </div>`
  ).join("");

  html += `
    <button onclick="newGame()"
      class="mt-10 bg-blue-500 px-8 py-4 rounded text-2xl font-bold">
      Nueva partida
    </button>
  `;

  document.getElementById("gameSection")
    .innerHTML = html;
});

function newGame(){
  socket.emit("newGame", currentRoomCode);
}
</script>

</body>
</html>
