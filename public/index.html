<!DOCTYPE html>
<html>
<head>
  <title>Mentira Maestra - TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center">

<div class="text-center max-w-3xl w-full px-6">

  <h1 class="text-5xl font-bold mb-6">
    🎭 Mentira Maestra
  </h1>

  <div id="roomSection" class="mb-8 hidden">
    <h2 class="text-3xl mb-2">
      Código: <span id="roomCode"></span>
    </h2>

    <img id="qrImage" class="mx-auto mt-4 w-48">
  </div>

  <div id="playersSection" class="mb-8 hidden">
    <h2 class="text-2xl mb-4">Jugadores</h2>

    <div id="playersList" class="space-y-2"></div>
    <div id="readyCounter" class="mt-6 text-3xl font-bold"></div>

    <button id="startBtn"
      onclick="startGame()"
      disabled
      class="mt-6 bg-green-500 px-6 py-3 rounded text-xl font-bold opacity-50">
      Iniciar partida
    </button>
  </div>

  <div id="gameSection"></div>

</div>

<script>
const socket = io("/host");
let currentRoomCode = null;
let previousReadyState = {};

socket.emit("createRoom");

socket.on("roomCreated", data => {
  currentRoomCode = data.code;

  document.getElementById("roomSection").classList.remove("hidden");
  document.getElementById("playersSection").classList.remove("hidden");

  document.getElementById("roomCode").innerText = data.code;
  document.getElementById("qrImage").src = data.qr;
});

socket.on("updatePlayers", players => {
  renderLobby(players.map(name => ({
    name,
    ready: false
  })));
});

socket.on("lobbyUpdate", data => {
  renderLobby(data.playersStatus);
});

socket.on("allQuestionsSubmitted", () => {
  const btn = document.getElementById("startBtn");
  btn.disabled = false;
  btn.classList.remove("opacity-50");
});

function renderLobby(players) {
  const list = document.getElementById("playersList");
  list.innerHTML = "";

  let readyCount = 0;

  players.forEach(p => {
    if (p.ready) readyCount++;

    const div = document.createElement("div");
    div.className =
      "flex justify-between items-center text-xl bg-gray-800 px-4 py-3 rounded transition";

    if (p.ready && !previousReadyState[p.name]) {
      div.classList.add("animate-bounce");
      setTimeout(() => div.classList.remove("animate-bounce"), 600);
    }

    div.innerHTML = `
      <span>${p.name}</span>
      <span class="text-2xl">
        ${p.ready ? "✔" : "⏳"}
      </span>
    `;

    list.appendChild(div);
    previousReadyState[p.name] = p.ready;
  });

  document.getElementById("readyCounter").innerText =
    `${readyCount} / ${players.length} listos`;
}

function startGame(){
  socket.emit("startGame", currentRoomCode);
}

socket.on("tvQuestion", q => {
  document.getElementById("gameSection").innerHTML =
    `<h2 class="text-4xl mt-10">${q}</h2>`;
});

socket.on("tvResults", data => {
  document.getElementById("gameSection").innerHTML =
    `<h2 class="text-4xl mt-10">Respuesta:</h2>
     <p class="text-3xl mt-4">${data.answer}</p>`;
});

socket.on("tvFinal", data => {
  let html = `<h1 class="text-5xl mt-10 mb-6">🏆 RESULTADOS</h1>`;

  html += data.ranking.map((p,i)=>
    `<div class="text-2xl">${i+1}. ${p.name} - ${p.score} pts</div>`
  ).join("");

  document.getElementById("gameSection").innerHTML = html;
});
</script>

</body>
</html>
