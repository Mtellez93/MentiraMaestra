<!DOCTYPE html>
<html>
<head>
  <title>Mentira Maestra - Player</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-purple-700 to-pink-600 text-white min-h-screen flex flex-col">

<!-- CONTENEDOR PRINCIPAL -->
<div class="flex-1 flex flex-col justify-center px-6">

  <!-- JOIN SCREEN -->
  <div id="joinScreen" class="space-y-4">

    <h1 class="text-3xl font-bold text-center mb-6">
      🎭 Mentira Maestra
    </h1>

    <input id="roomInput"
      placeholder="Código de sala"
      class="w-full p-4 rounded-xl text-black text-lg" />

    <input id="nameInput"
      placeholder="Tu nombre"
      class="w-full p-4 rounded-xl text-black text-lg" />

    <button onclick="join()"
      class="w-full bg-yellow-400 text-black text-lg font-bold p-4 rounded-xl active:scale-95 transition">
      Entrar
    </button>

    <p id="errorMsg" class="text-red-200 text-center text-sm"></p>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen"
       class="hidden flex flex-col justify-center space-y-6">

    <div id="gameContent"
         class="text-center"></div>

  </div>

</div>

<script>
const socket = io("/player");
const params = new URLSearchParams(window.location.search);

let roomFromURL = params.get("room");
let playerId = localStorage.getItem("mm_playerId");
let token = localStorage.getItem("mm_token");

if (roomFromURL) {
  document.getElementById("roomInput").value = roomFromURL;
}

/* ================= JOIN ================= */

function join(){
  const roomCode =
    document.getElementById("roomInput")
      .value.trim().toUpperCase();

  const name =
    document.getElementById("nameInput")
      .value.trim();

  if (!roomCode || !name) {
    document.getElementById("errorMsg")
      .innerText = "Completa todos los campos";
    return;
  }

  socket.emit("joinRoom", {
    roomCode,
    name,
    playerId,
    token
  });

  document.getElementById("joinScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  document.getElementById("gameContent")
    .innerHTML =
      "<h2 class='text-xl'>Conectando...</h2>";
}

/* ================= AUTH ================= */

socket.on("authAssigned", data => {
  playerId = data.playerId;
  token = data.token;

  localStorage.setItem("mm_playerId", playerId);
  localStorage.setItem("mm_token", token);
});

/* ================= QUESTION PHASE ================= */

socket.on("playerQuestionPhase", () => {
  document.getElementById("gameContent")
    .innerHTML = `
      <h2 class="text-2xl font-bold mb-4">
        Escribe tu pregunta 🧠
      </h2>

      <input id="questionInput"
        class="w-full p-4 rounded-xl text-black text-lg mb-3"
        placeholder="Tu pregunta..." />

      <input id="answerInput"
        class="w-full p-4 rounded-xl text-black text-lg mb-4"
        placeholder="Respuesta correcta..." />

      <button onclick="sendQuestion()"
        class="w-full bg-green-400 text-black text-lg font-bold p-4 rounded-xl active:scale-95 transition">
        Enviar
      </button>
    `;
});

function sendQuestion(){
  const question =
    document.getElementById("questionInput").value;

  const answer =
    document.getElementById("answerInput").value;

  if (question.length < 10 || answer.length < 3) return;

  socket.emit("submitQuestion", { question, answer });

  document.getElementById("gameContent")
    .innerHTML =
      "<h2 class='text-xl'>Pregunta enviada ✔</h2>";
}

/* ================= WRITE LIE ================= */

socket.on("playerWrite", () => {
  document.getElementById("gameContent")
    .innerHTML = `
      <h2 class="text-2xl font-bold mb-4">
        Escribe tu mentira 😈
      </h2>

      <input id="lieInput"
        class="w-full p-4 rounded-xl text-black text-lg mb-4"
        placeholder="Tu mentira..." />

      <button onclick="sendLie()"
        class="w-full bg-green-400 text-black text-lg font-bold p-4 rounded-xl active:scale-95 transition">
        Enviar
      </button>
    `;
});

function sendLie(){
  const lie =
    document.getElementById("lieInput").value;

  if (!lie) return;

  socket.emit("submitLie", lie);

  document.getElementById("gameContent")
    .innerHTML =
      "<h2 class='text-xl'>Mentira enviada ✔</h2>";
}

/* ================= VOTING ================= */

socket.on("playerVote", data => {
  let html = `
    <h2 class="text-2xl font-bold mb-4">
      ¿Cuál es la correcta?
    </h2>
  `;

  data.options.forEach(opt => {
    html += `
      <button onclick="vote('${opt.id}')"
        class="w-full bg-yellow-400 text-black text-lg font-bold p-4 rounded-xl mb-3 active:scale-95 transition">
        ${opt.text}
      </button>
    `;
  });

  document.getElementById("gameContent")
    .innerHTML = html;
});

function vote(id){
  socket.emit("submitVote", id);

  document.getElementById("gameContent")
    .innerHTML =
      "<h2 class='text-xl'>Voto enviado ✔</h2>";
}

/* ================= FINAL ================= */

socket.on("playerFinal", () => {
  document.getElementById("gameContent")
    .innerHTML = `
      <h2 class="text-3xl font-bold">
        🎉 Juego terminado
      </h2>
    `;
});

/* ================= ERROR ================= */

socket.on("error", msg => {
  document.getElementById("errorMsg")
    .innerText = msg;

  document.getElementById("joinScreen")
    .classList.remove("hidden");

  document.getElementById("gameScreen")
    .classList.add("hidden");
});
</script>

</body>
</html>
