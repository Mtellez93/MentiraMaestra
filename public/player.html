<!DOCTYPE html>
<html>
<head>
  <title>Jugador - Mentira Maestra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <input id="name" placeholder="Tu nombre">
  <input id="room" placeholder="Código sala">
  <button onclick="join()" class="primary">Entrar</button>
</div>

<div class="card" id="game" style="display:none;">
  <h2 id="question"></h2>
  <div id="inputArea"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let roomCode = "";

function join() {
  const name = document.getElementById("name").value;
  roomCode = document.getElementById("room").value.toUpperCase();
  socket.emit("joinRoom", { roomCode, name });
  document.querySelectorAll(".card")[0].style.display = "none";
  document.getElementById("game").style.display = "block";
}

socket.on("newRound", data => {
  document.getElementById("question").innerText = data.question;
  document.getElementById("inputArea").innerHTML =
    `<input id="lie" placeholder="Escribe tu mentira">
     <button class="primary" onclick="sendLie()">Enviar</button>`;
});

function sendLie() {
  const lie = document.getElementById("lie").value;
  socket.emit("submitLie", { roomCode, lie });
  document.getElementById("inputArea").innerHTML = "Esperando a los demás...";
}

socket.on("startVoting", data => {
  let html = "";
  data.options.forEach(opt => {
    html += `<button class="primary" onclick="vote('${opt.replace(/'/g,"\\'")}')">${opt}</button><br>`;
  });
  document.getElementById("inputArea").innerHTML = html;
});

function vote(option) {
  socket.emit("submitVote", { roomCode, vote: option });
  document.getElementById("inputArea").innerHTML = "Voto enviado...";
}
</script>

</body>
</html>
